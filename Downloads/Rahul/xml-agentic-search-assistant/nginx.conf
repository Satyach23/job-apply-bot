# ===========================================================
# Nginx — ACP Document Analyzer reverse proxy
# ===========================================================
# - Serves /static/ files directly from disk (fast, no Python)
# - Proxies everything else to the FastAPI backend on :8000
# - Handles large file uploads (up to 50 MB)
# ===========================================================

server {
    listen 80;
    server_name _;

    # Allow large document uploads (PDF, DOCX can be big)
    client_max_body_size 50M;

    # Serve static assets (CSS, logo) directly from Nginx
    # — faster than routing through Python
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to the FastAPI backend
    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for LLM processing (can take 30s+)
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }
}
